<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Buyer — Sign In</title>
  <style>
    :root{--bg:#000;--surface:#0a0a0a;--surface-2:#111;--border:#1a1a1a;--border-focus:#2a2a2a;--text:#fafafa;--text-secondary:#71717a;--text-muted:#3f3f46;--green:#22c55e;--green-dim:#14532d;--red:#ef4444;--red-dim:#450a0a;--radius:10px;--radius-lg:14px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:400px;max-width:95vw;padding:40px 32px}
    .logo{width:44px;height:44px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#000;margin-bottom:24px}
    h1{font-size:20px;font-weight:600;margin-bottom:4px}
    .subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:28px}
    .social-btn{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;margin-bottom:10px}
    .social-btn:hover{border-color:var(--border-focus);background:#161616}
    .social-btn svg{width:20px;height:20px;flex-shrink:0}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .form-group{margin-bottom:16px}
    .form-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s}
    .form-input:focus{border-color:var(--green)}
    .form-input::placeholder{color:var(--text-muted)}
    .btn-green{width:100%;padding:12px;background:var(--green);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:4px}
    .btn-green:hover{background:#16a34a}
    .footer{text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)}
    .footer a{color:var(--text-secondary);text-decoration:none}.footer a:hover{text-decoration:underline}
    .app-name{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:32px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--text);z-index:300;transition:transform .3s ease}
    .toast.show{transform:translateX(-50%) translateY(0)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:none;width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
    .btn-green.loading .spinner{display:inline-block}
    .btn-green.loading span{display:none}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">M</div>
    <div class="app-name">MC Buyer</div>
    <h1>Secure Access</h1>
    <p class="subtitle">Sign in to MC Buyer</p>

    <button class="social-btn" onclick="loginWith('google')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <button class="social-btn" onclick="loginWith('apple')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Continue with Apple
    </button>

    <div class="divider">or use email</div>

    <form onsubmit="loginWithEmail(event)">
      <div class="form-group">
        <input type="email" class="form-input" id="email" placeholder="Email address" required autocomplete="email">
      </div>
      <button type="submit" class="btn-green" id="email-btn">
        <span>Continue with email</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="footer">By continuing, you agree to MC Buyer's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const redirectUri = params.get('redirect_uri');
    const state = params.get('state');

    function loginWith(provider) {
      fetch('/auth/login/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, session_id: sessionId, redirect_uri: redirectUri, state })
      }).then(r => r.json()).then(data => {
        if (data.redirect) window.location.href = data.redirect;
        else showToast(data.error || 'Login failed');
      }).catch(() => showToast('Network error'));
    }

    function loginWithEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      const btn = document.getElementById('email-btn');
      btn.classList.add('loading');
      fetch('/auth/login/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: 'email', email, session_id: sessionId, redirect_uri: redirectUri, state })
      }).then(r => r.json()).then(data => {
        btn.classList.remove('loading');
        if (data.redirect) window.location.href = data.redirect;
        else showToast(data.error || 'Login failed');
      }).catch(() => { btn.classList.remove('loading'); showToast('Network error'); });
    }

    if (!sessionId || !redirectUri) {
      document.querySelector('.login-card').innerHTML = '<div style="text-align:center;padding:20px"><h2>Invalid request</h2><p style="color:var(--text-secondary);margin-top:8px">Missing session or redirect parameters.</p></div>';
    }

    function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }
  </script>
</body>
</html>
