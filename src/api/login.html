<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Buyer — Sign In</title>
  <style>
    :root{--bg:#000;--surface:#0a0a0a;--surface-2:#111;--border:#1a1a1a;--border-focus:#2a2a2a;--text:#fafafa;--text-secondary:#71717a;--text-muted:#3f3f46;--green:#22c55e;--green-dim:#14532d;--red:#ef4444;--radius:10px;--radius-lg:14px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:400px;max-width:95vw;padding:40px 32px}
    .logo{width:44px;height:44px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#000;margin-bottom:24px}
    h1{font-size:20px;font-weight:600;margin-bottom:4px}
    .subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:28px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
    .form-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s}
    .form-input:focus{border-color:var(--green)}
    .form-input::placeholder{color:var(--text-muted)}
    .form-error{font-size:13px;color:var(--red);margin-bottom:12px;display:none}
    .btn-green{width:100%;padding:12px;background:var(--green);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
    .btn-green:hover{background:#16a34a}
    .btn-green:disabled{opacity:.5;cursor:not-allowed}
    .switch{margin-top:20px;text-align:center;font-size:13px;color:var(--text-secondary)}
    .switch a{color:var(--green);text-decoration:none;cursor:pointer;font-weight:500}
    .switch a:hover{text-decoration:underline}
    .footer{text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--text);z-index:300;transition:transform .3s ease}
    .toast.show{transform:translateX(-50%) translateY(0)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{display:none;width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
    .btn-green.loading .spinner{display:inline-block}
    .btn-green.loading span{display:none}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">M</div>
    <h1 id="form-title">Sign in to MC Buyer</h1>
    <p class="subtitle" id="form-subtitle">Enter your email and password to continue.</p>

    <div class="form-error" id="error-msg"></div>

    <form onsubmit="handleSubmit(event)" id="auth-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-input" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="current-password">
      </div>
      <div class="form-group" id="confirm-group" style="display:none">
        <label class="form-label" for="confirm">Confirm password</label>
        <input type="password" class="form-input" id="confirm" placeholder="Repeat password" minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-green" id="submit-btn">
        <span>Sign in</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="switch">
      <span id="switch-text">Don't have an account?</span>
      <a onclick="toggleMode()" id="switch-link">Create one</a>
    </div>

    <div class="footer">MC Buyer v1.2.0</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let isRegister = false;
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const redirectUri = params.get('redirect_uri');

    function toggleMode() {
      isRegister = !isRegister;
      document.getElementById('form-title').textContent = isRegister ? 'Create your MC Buyer account' : 'Sign in to MC Buyer';
      document.getElementById('form-subtitle').textContent = isRegister ? 'Set up your account to start using MC Buyer.' : 'Enter your email and password to continue.';
      document.getElementById('confirm-group').style.display = isRegister ? 'block' : 'none';
      document.getElementById('submit-btn').querySelector('span').textContent = isRegister ? 'Create account' : 'Sign in';
      document.getElementById('switch-text').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('switch-link').textContent = isRegister ? 'Sign in' : 'Create one';
      document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('error-msg').style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (isRegister) {
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) { showError('Passwords do not match'); return; }
      }

      const btn = document.getElementById('submit-btn');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const endpoint = isRegister ? '/auth/register' : '/auth/login';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Failed'); btn.classList.remove('loading'); btn.disabled = false; return; }

        sessionStorage.setItem('mc-token', data.token);
        sessionStorage.setItem('mc-user-id', data.userId);
        sessionStorage.setItem('mc-email', email);

        const setupUrl = new URL('/auth/setup', window.location.origin);
        setupUrl.searchParams.set('session_id', sessionId || '');
        window.location.href = setupUrl.toString();
      } catch {
        showError('Network error');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    if (!sessionId) {
      document.querySelector('.login-card').innerHTML = '<div style="text-align:center;padding:20px"><h2>Invalid request</h2><p style="color:var(--text-secondary);margin-top:8px">Missing session parameters.</p></div>';
    }
  </script>
</body>
</html>
